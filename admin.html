<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Page - Little Chefs</title>

  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#FF9AA2;
      --accent:#FFDAC1;
      --green:#B5EAD7;
      --blue:#C7CEEA;
      --yellow:#FFE5B4;
      --dark:#5D576B;
      --light:#FFF9F5;

      --radius:16px;
      --shadow:0 8px 25px rgba(93, 87, 107, 0.10);
      --t: all 0.25s ease;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      font-family:'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--accent) 0%, var(--blue) 100%);
      min-height:100vh;
      padding:20px;
      color:var(--dark);
    }

    .container{
      max-width: 1000px;
      margin: 0 auto;
      background:#fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      border: 6px solid var(--yellow);
    }

    header{
      background: #ffffff;
      padding: 22px 26px;
      border-bottom: 3px solid rgba(255,218,193,0.9);
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .welcome{
      font-family:'Comic Neue', cursive;
      font-size: 2.1rem;
      font-weight: 700;
    }

    .logout{
      font-weight: 900;
      color: var(--dark);
      text-decoration: underline;
      cursor:pointer;
      padding: 8px 10px;
      border-radius: 10px;
      transition: var(--t);
    }

    .logout:hover{
      background: rgba(199,206,234,0.35);
    }

    main{
      background: var(--light);
      padding: 24px;
    }

    .panel{
      background:#fff;
      border-radius: 14px;
      padding: 20px;
      border: 2px solid rgba(93,87,107,0.25);
      margin-bottom: 18px;
    }

    .panel-title{
      font-family:'Comic Neue', cursive;
      font-size: 1.9rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .info-lines{
      line-height: 1.9;
      font-size: 1.05rem;
    }

    .info-lines b{
      display:inline-block;
      min-width: 140px;
    }

    .section-title{
      font-family:'Comic Neue', cursive;
      font-size: 2rem;
      margin: 18px 0 12px;
      font-weight: 700;
    }

    /* Tables */
    table{
      width:100%;
      border-collapse: collapse;
      background:#fff;
      border: 2px solid rgba(93,87,107,0.35);
    }

    th, td{
      border: 2px solid rgba(93,87,107,0.35);
      padding: 14px 12px;
      vertical-align: top;
    }

    th{
      background: rgba(199,206,234,0.55);
      font-weight: 900;
      text-align: center;
    }

    td{
      background: #fff;
    }

    .recipe-link{
      font-weight: 900;
      color: #1f3f9e;
      text-decoration: underline;
      cursor: pointer;
    }

    .creator-cell{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .avatar{
      width:56px;
      height:56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      background:#fff;
    }

    .radio-group{
      display:flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .radio-item{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 800;
    }

    .submit-btn{
      border:none;
      cursor:pointer;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 900;
      font-family:'Comic Neue', cursive;
      background: var(--green);
      color: var(--dark);
      box-shadow: 0 5px 0 #8FD5B7;
      transition: var(--t);
      min-width: 120px;
    }

    .submit-btn:hover{
      transform: translateY(-3px);
      box-shadow: 0 8px 0 #8FD5B7;
    }

    .small-note{
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 10px;
      line-height: 1.6;
    }

    @media (max-width: 820px){
      .welcome{ font-size: 1.8rem; }
      th, td{ padding: 12px 10px; }
      .creator-cell{ flex-direction: column; align-items:flex-start; }
      .avatar{ width: 50px; height: 50px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="topbar">
        <div class="welcome">Welcome Lama</div>
        <a href="index.html"><div class="logout">Logout</div></a>
      </div>
    </header>

    <main>
      <!-- My Information -->
      <section class="panel">
        <div class="panel-title">My Information</div>
        <div class="info-lines">
          <div><b>Name</b> <span>Lama</span></div>
          <div><b>Email address</b> <span>Lama@littlechefs.com</span></div>
        </div>
      </section>

      <!-- Reported Recipes -->
      <div class="section-title">Reported Recipes</div>

      <section class="panel" style="padding:0; overflow:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:40%;">Recipe Name</th>
              <th style="width:30%;">Recipe Creator</th>
              <th style="width:30%;">Action</th>
            </tr>
          </thead>

          <tbody >
            <!-- Row 1 (sample) -->
            <tr>
              <td>
               <a href="view-recipe.html"> <div class="recipe-link" >
                  Banana Pancakes
                </div></a>
              </td>

              <td>
                <div class="creator-cell">
                  <div>
                    <div style="font-weight:900;" class="creator-name">Sara</div>
                    <div class="small-note">Creator</div>
                  </div>
                  <img class="avatar" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=200&q=80" alt="creator photo">
                </div>
              </td>

              <td>
                <form class="action-form">
                  <div class="radio-group">
                    <label class="radio-item">
                      <input type="radio" name="actionRow1" value="block" required>
                      Block User
                    </label>

                    <label class="radio-item">
                      <input type="radio" name="actionRow1" value="dismiss">
                      Dismiss Report
                    </label>
                  </div>

                  <button class="submit-btn" type="submit">Submit</button>
                </form>
              </td>
            </tr>

            <!-- Row 2 (sample) -->
            <tr>
              <td>
               <a href="view-recipe.html"><div class="recipe-link" >
                  Fruit Yogurt Cups
                </div></a>
              </td>

              <td>
                <div class="creator-cell">
                  <div>
                    <div style="font-weight:900;" class="creator-name">Omar</div>
                    <div class="small-note">Creator</div>
                  </div>
                  <img class="avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="creator photo">
                </div>
              </td>

              <td>
                <form class="action-form">
                  <div class="radio-group">
                    <label class="radio-item">
                      <input type="radio" name="actionRow2" value="block" required>
                      Block User
                    </label>

                    <label class="radio-item">
                      <input type="radio" name="actionRow2" value="dismiss">
                      Dismiss Report
                    </label>
                  </div>

                  <button class="submit-btn" type="submit">Submit</button>
                </form>
              </td>
            </tr>

          </tbody>
        </table>
      </section>

      <!-- Blocked Users List -->
      <div class="section-title" style="margin-top:22px;">Blocked Users List</div>

      <section class="panel" style="padding:0; overflow:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:50%;">Name</th>
              <th style="width:50%;">Email Address</th>
            </tr>
          </thead>

          <tbody id="blockedTableBody">
            <tr>
              <td>—</td>
              <td>—</td>
            </tr>
          </tbody>
        </table>
      </section>

    </main>
  </div>

  
</body>
</html>
