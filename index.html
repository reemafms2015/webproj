<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kids Recipes | Home</title>


  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #FF9AA2;
      --secondary: #FFDAC1;
      --mint: #B5EAD7;
      --lavender: #C7CEEA;
      --yellow: #FFE5B4;
      --dark: #5D576B;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--secondary), var(--lavender));
      color: var(--dark);
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

 
    header {
      background: linear-gradient(to right, var(--primary), var(--lavender));
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 130px;
      height: auto;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    header h1 {
      font-family: 'Comic Neue', cursive;
      font-size: 2.4rem;
      color: white;
    }

    nav a {
      margin-left: 25px;
      color: white;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      padding-bottom: 5px;
      position: relative;
    }

    nav a:hover {
      color: var(--yellow);
    }

    nav a.active {
      color: var(--yellow);
      border-bottom: 3px solid var(--yellow);
    }

  
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero {
      background: white;
      width: 90%;
      max-width: 900px;
      padding: 90px 60px;
      text-align: center;
      border-radius: 22px;
      border: 10px solid var(--mint);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      animation: floatCard 3s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }

    .hero h2 {
      font-family: 'Comic Neue', cursive;
      font-size: 3.1rem;
      margin-bottom: 25px;
    }

    .hero p {
      font-size: 1.4rem;
      margin-bottom: 45px;
      line-height: 1.8;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .login-btn {
      background: linear-gradient(to right, var(--primary), var(--lavender));
      color: white;
      padding: 18px 80px;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .signup-text {
      font-size: 1.05rem;
    }

    .signup-text a {
      font-weight: 700;
      color: var(--dark);
      text-decoration: underline;
      cursor: pointer;
    }

    /* =====================
       Footer
    ===================== */
    footer {
      background: var(--mint);
      padding: 25px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      .logo {
        width: 110px;
      }

      .hero {
        padding: 50px 25px;
      }

      .hero h2 {
        font-size: 2.3rem;
      }

      .hero p {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <header>
    <div class="header-left">
      <img src="photo.png" alt="Kids Recipes Logo" class="logo">
      <h1>LittleChefs</h1>
    </div>

    <nav><a class="active" href="index.html">Home</a>
      <a href="#">Users</a>
	        <a href="#">Admins</a>
    
    </nav>
  </header>

  <!-- Main -->
  <main>
    <section class="hero">
      <h2>🍓 Healthy & Fun Recipes for Kids</h2>

      <p>
        A colorful and friendly website designed to help parents
        discover healthy delicious and easy recipes specially made for kids
      </p>

      <div class="login-box">
        <button class="login-btn" onclick="window.location.href='login.html'">Log-in</button>
        <div class="signup-text">
          New User? <a href="signin.html">Sign-up</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    © 2026 Kids Recipes — Made with 💖 for little ones
  </footer>

</div>

<script>
  function setActive(element) {
    const links = document.querySelectorAll("nav a");
    links.forEach(link => link.classList.remove("active"));
    element.classList.add("active");
  }

</script>

</body>

</html>
