<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kids Recipes | Login</title>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Comic+Neue:wght@700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* 
       Color Palette
   */
    :root {
      --primary: #FF9AA2;
      --secondary: #FFDAC1;
      --mint: #B5EAD7;
      --lavender: #C7CEEA;
      --yellow: #FFE5B4;
      --dark: #5D576B;
      --white: #ffffff;
    }

    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Nunito", sans-serif;
      background: linear-gradient(135deg, var(--secondary), var(--lavender));
      color: var(--dark);
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       Header Section
    ========================== */
    header {
      background: linear-gradient(to right, var(--primary), var(--lavender));
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 130px;
      height: auto;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
    }

    header h1 {
      font-family: "Comic Neue", cursive;
      font-size: 2.4rem;
      color: var(--white);
    }

    nav a {
      margin-left: 25px;
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      padding-bottom: 5px;
    }

    nav a:hover {
      color: var(--yellow);
    }

    /* =========================
       Main Content
    ========================== */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: var(--white);
      width: 90%;
      max-width: 520px;
      padding: 50px 45px;
      border-radius: 22px;
      border: 10px solid var(--mint);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    .card h2 {
      font-family: "Comic Neue", cursive;
      font-size: 2.4rem;
      margin-bottom: 18px;
      text-align: center;
    }

    .card p {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-weight: 700;
    }

    input {
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid var(--lavender);
      font-size: 1rem;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .primary-btn {
      background: linear-gradient(to right, var(--primary), var(--lavender));
      color: var(--white);
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .primary-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .helper {
      text-align: center;
      margin-top: 14px;
      font-size: 1rem;
    }

    .helper a {
      font-weight: 700;
      color: var(--dark);
      text-decoration: underline;
    }

    /* =========================
       Footer
    ========================== */
    footer {
      background: var(--mint);
      padding: 25px;
      text-align: center;
      font-weight: 600;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      .logo {
        width: 110px;
      }

      .card {
        padding: 40px 25px;
      }

      .card h2 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <header>
    <div class="header-left">
      <img src="photo.png" alt="Kids Recipes Logo" class="logo" />
      <h1>LittleChefs</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="#">Users</a>
      <a href="#">Admins</a>
    </nav>
  </header>

  <!-- Login Card -->
  <main>
    <section class="card">
      <h2>Welcome Back</h2>
      <div id="message" style="text-align:center; margin-bottom:15px; font-weight:bold;"></div>
      <p>Log in to save and share your favorite recipes.</p>

     <form action="login.php" method="POST">
  <div>
    <label for="email">Email</label>
    <input
      id="email"
      name="emailAddress"
      type="email"
      placeholder="you@example.com"
      required
    />
  </div>

  <div>
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter your password"
      required
    />
  </div>

  <div class="btn-group">
    <button class="primary-btn" type="submit">
      Log In
    </button>
  </div>
</form>

      <div class="helper">
        New here? <a href="signin.html">Create an account</a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    © 2026 Kids Recipes — Made with 💖 for little ones
  </footer>

</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const messageDiv = document.getElementById("message");

  if (params.has("error")) {
    messageDiv.style.color = "red";
    messageDiv.textContent = params.get("error");
  }

  if (params.has("success")) {
    messageDiv.style.color = "green";
    messageDiv.textContent = params.get("success");
  }
</script>
</body>
</html>
